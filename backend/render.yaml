services:
  - type: web
    name: one-virus-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: USER_PASSWORD_HASH
        sync: false
